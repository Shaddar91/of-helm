name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

#an explicit bash shell adds -o pipefail, so a failed helm template fails its kubeconform pipe
defaults:
  run:
    shell: bash

env:
  #placeholders for the values the Argo CD Application sets per region
  SET_VALUES: image.repository=registry.invalid/app,image.tag=ci,containerPort=8000,targetGroupBinding.targetGroupARN=arn:aws:elasticloadbalancing:us-east-1:000000000000:targetgroup/ci/0000000000000000,secrets.db.name=ci,keda.awsRegion=us-east-1
  HELM_VERSION: v4.3.0
  HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - env:
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      - name: Lint every chart and validate the render of every values file
        run: |
          for chart in charts/*; do
            helm lint "$chart" --set "$SET_VALUES"
            for values in "$chart"/values*.yaml; do
              echo "$values"
              helm template x "$chart" -f "$values" --set "$SET_VALUES" \
                | kubeconform -strict -summary -kubernetes-version 1.36.0 \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
            done
          done

  snyk:
    #fork PRs get no secrets; lint still covers them
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      #snyk reads Kubernetes manifests, not chart templates, and only paths under the working directory
      - name: Render every chart
        run: |
          mkdir -p rendered
          for chart in charts/*; do
            helm template x "$chart" -f "$chart/values-amd64.yaml" --set "$SET_VALUES" > "rendered/$(basename "$chart").yaml"
          done
      - name: Kubernetes misconfigurations, high and critical
        run: npx --yes snyk@1.1307.4 iac test rendered --severity-threshold=high
