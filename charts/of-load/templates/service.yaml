apiVersion: v1
kind: Service
metadata:
  name: {{ include "of-load.fullname" . }}
  labels:
    {{- include "of-load.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "of-load.selectorLabels" . | nindent 4 }}
