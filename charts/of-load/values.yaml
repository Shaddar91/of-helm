replicaCount: 2

image:
  repository: ""
  tag: fe7703bcc7175a90b60d84e9a6e379e288954ec6
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80

targetGroupBinding: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: "1"
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

preStopSleepSeconds: 20
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  enabled: true
  usePodIdentity: true
  name: ""
  keys: [OF_API_URL, CORS_ALLOWED_ORIGINS]

stress:
  maxInflight: 4
  maxCpuMs: 2000
  maxMemMib: 256
  authCacheSeconds: 30

levels:
  - {name: easy, concurrency: 1, duration_seconds: 300, cpu_ms: 500, mem_mib: 64}
  - {name: medium, concurrency: 4, duration_seconds: 300, cpu_ms: 1000, mem_mib: 128}
  - {name: high, concurrency: 12, duration_seconds: 300, cpu_ms: 1500, mem_mib: 192}
